name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Node 22, not the ">=20" floor in engines: the pinned pnpm in
      # packageManager requires >=22.13, and setup-node runs pnpm to
      # resolve the cache directory, so Node 20 cannot even install here.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # astro check regenerates the EmDash collection types itself, so no
      # database or seed step is needed on a clean checkout.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
