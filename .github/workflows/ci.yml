name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # The declared minimum in package.json engines — test the floor, not
      # just whatever the maintainer happens to run.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # astro check regenerates the EmDash collection types itself, so no
      # database or seed step is needed on a clean checkout.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
