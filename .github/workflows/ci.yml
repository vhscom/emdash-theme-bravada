name: CI

on:
  push:
    branches: [main, deploy/cloudflare]
  pull_request:

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Matches the floor in package.json engines — test what we promise.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # astro check regenerates the EmDash collection types itself, so no
      # database or seed step is needed on a clean checkout.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # A build that succeeds can still produce something that cannot start.
      # v0.9.0 shipped exactly that, with typecheck and tests both green.
      #
      # Which smoke to run is decided by what the build EMITTED, not by the
      # branch: a branch-name gate skips silently if the name ever changes,
      # and a skipped check is the failure mode this step exists to catch.
      # Both adapters emit dist/server/entry.mjs, so that cannot tell them
      # apart — only the Cloudflare one also emits dist/server/wrangler.json.
      # Recognising neither is an error, never a skip.
      - name: Smoke the built site
        run: |
          if [ -f dist/server/wrangler.json ]; then
            target=worker
            npx wrangler dev --port 8787 --persist-to "$RUNNER_TEMP/wrangler-state" &
          elif [ -f dist/server/entry.mjs ]; then
            target=node
            node ./dist/server/entry.mjs &
          else
            echo "::error::build emitted neither a Node server nor a Worker"
            exit 1
          fi
          server=$!
          port=$([ "$target" = worker ] && echo 8787 || echo 4321)
          trap 'kill "$server" 2>/dev/null || true' EXIT
          echo "smoking the $target build on :$port"
          for _ in $(seq 1 60); do
            if curl -sS -o /dev/null -m 2 "http://localhost:$port/"; then break; fi
            if ! kill -0 "$server" 2>/dev/null; then
              echo "::error::$target build exited during startup"
              wait "$server" || true
              exit 1
            fi
            sleep 1
          done
          code=$(curl -sS -o /dev/null -m 15 -w '%{http_code}' "http://localhost:$port/" || echo 000)
          # No database or .env on a clean checkout, so the site redirects to
          # the setup wizard. The claim is that it serves HTTP, not what it says.
          echo "GET / -> $code"
          case "$code" in
            2*|3*) echo "$target build serves" ;;
            *) echo "::error::$target build did not serve (got $code)"; exit 1 ;;
          esac
