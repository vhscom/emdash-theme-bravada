name: CI

on:
  push:
    branches: [main, deploy/cloudflare]
  pull_request:

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Matches the floor in package.json engines — test what we promise.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # astro check regenerates the EmDash collection types itself, so no
      # database or seed step is needed on a clean checkout.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Typecheck and tests both pass on a server that cannot boot. v0.9.0
      # shipped exactly that. Start it and ask for one page.
      - name: Smoke the self-hosted build
        if: github.ref != 'refs/heads/deploy/cloudflare'
        run: |
          node ./dist/server/entry.mjs &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sS -o /dev/null -m 2 http://localhost:4321/; then break; fi
            if ! kill -0 "$server" 2>/dev/null; then
              echo "::error::server exited during startup"
              wait "$server" || true
              exit 1
            fi
            sleep 1
          done
          code=$(curl -sS -o /dev/null -m 10 -w '%{http_code}' http://localhost:4321/ || echo 000)
          echo "GET / -> $code"
          case "$code" in
            2*|3*) echo "self-hosted build serves" ;;
            *) echo "::error::self-hosted build did not serve (got $code)"; exit 1 ;;
          esac

      # This branch builds a Worker. A clean `astro build` does not prove it
      # runs: the bundler pins exist because rolldown can emit a bare
      # require() shim that throws at module init under workerd. Only the
      # real runtime catches that.
      #
      # --persist-to gives miniflare scratch bindings. With no local state
      # the site redirects to setup, so 3xx is a pass.
      - name: Smoke the Worker under workerd
        if: github.ref == 'refs/heads/deploy/cloudflare'
        run: |
          npx wrangler dev --port 8787 --persist-to "$RUNNER_TEMP/wrangler-state" &
          worker=$!
          trap 'kill "$worker" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -sS -o /dev/null -m 2 http://localhost:8787/; then break; fi
            if ! kill -0 "$worker" 2>/dev/null; then
              echo "::error::wrangler dev exited during startup"
              wait "$worker" || true
              exit 1
            fi
            sleep 1
          done
          code=$(curl -sS -o /dev/null -m 15 -w '%{http_code}' http://localhost:8787/ || echo 000)
          echo "GET / -> $code"
          case "$code" in
            2*|3*) echo "worker boots and serves under workerd" ;;
            *) echo "::error::worker did not serve under workerd (got $code)"; exit 1 ;;
          esac
